# This repo's own checks: every push and pull request must typecheck, pass its tests and build each Worker.
# On main, a second job deploys both Workers once the checks pass (f-06).
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6 # reads the pnpm version from package.json "packageManager"
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - name: Build each Worker (wrangler deploy --dry-run)
        run: |
          for app in apps/*/; do
            if [ -f "$app/wrangler.jsonc" ]; then
              (cd "$app" && pnpm exec wrangler deploy --dry-run)
            fi
          done

  # f-06: deploy on main, only after `check` passed. It needs two repository secrets: CLOUDFLARE_API_TOKEN (an API token
  # that can edit Workers and D1) and CLOUDFLARE_ACCOUNT_ID. Until you add them, every step below is skipped and the job
  # says so, so a fork or a fresh clone stays green.
  deploy:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # One deploy at a time, and never cancel one halfway (a half-applied migration is worse than a late deploy).
    concurrency:
      group: deploy
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: No Cloudflare secrets yet, so no deploy
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "::notice::Deploy skipped. Add the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets to deploy main."
      - uses: actions/checkout@v7
        if: env.CLOUDFLARE_API_TOKEN != ''
      - uses: pnpm/action-setup@v6
        if: env.CLOUDFLARE_API_TOKEN != ''
      - uses: actions/setup-node@v7
        if: env.CLOUDFLARE_API_TOKEN != ''
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: env.CLOUDFLARE_API_TOKEN != ''
      # Order matters. 1) The database first: migrations only add, so the code that's live now keeps working.
      - name: Apply D1 migrations
        if: env.CLOUDFLARE_API_TOKEN != ''
        uses: cloudflare/wrangler-action@v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.157.0" # the version in the lockfile, so the action uses it instead of installing another
          packageManager: pnpm
          workingDirectory: apps/agent
          command: d1 migrations apply DB --remote
      # 2) The agent, before the web app that calls it through the service binding.
      - name: Deploy the agent
        if: env.CLOUDFLARE_API_TOKEN != ''
        uses: cloudflare/wrangler-action@v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.157.0"
          packageManager: pnpm
          workingDirectory: apps/agent
          command: deploy
      # 3) The web app.
      - name: Deploy the web app
        if: env.CLOUDFLARE_API_TOKEN != ''
        uses: cloudflare/wrangler-action@v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.157.0"
          packageManager: pnpm
          workingDirectory: apps/web
          command: deploy

  # f-07: a Preview of the web app for each pull request, at its own URL (the web app only: see "previews" in
  # apps/web/wrangler.jsonc for why it gets no agent and no data). Same secrets and the same skip as deploy. Pull
  # requests from forks never get your secrets, so they always skip.
  preview:
    needs: check
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: No Cloudflare secrets here, so no Preview
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "::notice::Preview skipped (no CLOUDFLARE_API_TOKEN secret, or a pull request from a fork)."
      - uses: actions/checkout@v7
        if: env.CLOUDFLARE_API_TOKEN != ''
      - uses: pnpm/action-setup@v6
        if: env.CLOUDFLARE_API_TOKEN != ''
      - uses: actions/setup-node@v7
        if: env.CLOUDFLARE_API_TOKEN != ''
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: env.CLOUDFLARE_API_TOKEN != ''
      - name: Preview the web app
        id: preview
        if: env.CLOUDFLARE_API_TOKEN != ''
        uses: cloudflare/wrangler-action@v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.157.0"
          packageManager: pnpm
          workingDirectory: apps/web
          command: preview --name pr-${{ github.event.pull_request.number }}
      - name: Say where it is
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: echo "::notice::Preview at ${{ steps.preview.outputs.preview-url }}"
